name: Pre Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (e.g. 1.2.3). Opens a pull request stamping the changelog and bumping the version"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  pre-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: techcode-io/github-actions/setup-github-bot@cd725590b5db9dd4b9855453f3fc83f66e882abf # setup-github-bot/v1
      - uses: techcode-io/github-actions/setup-uv@f1054ff1cbac66b5acdc7c4d0d1d38f18a3a6030 # setup-uv/v1
      - run: uv sync --locked
      - run: uv run poe release:pre
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
