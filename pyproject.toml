[project]
name = "proclet"
version = "0.1.2"
description = "Fluent, typed subprocess wrapper with sync and async execution and pipelines."
authors = [
    { name = "Adrien Mannocci", email = "adrien.mannocci@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "subprocess",
    "process",
    "command",
    "pipeline",
    "pipe",
    "asyncio",
    "async",
    "shell",
    "sh",
    "popen",
    "timeout",
    "cli-wrapper",
    "privileges",
    "nice",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/techcode-io/proclet"
Homepage = "https://techcode-io.github.io/proclet/"
Documentation = "https://techcode-io.github.io/proclet/"
Changelog = "https://github.com/techcode-io/proclet/blob/main/CHANGELOG.md"
Tracker = "https://github.com/techcode-io/proclet/issues"

[dependency-groups]
dev = [
    "griffe2md>=1.5.1",
    "poethepoet>=0.36.0",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.0.0",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]

[tool.poe.tasks."env:configure"]
help = "Setup environment."
cmd = "pre-commit install"

[tool.poe.tasks.lint]
help = "Lint code project."
cmd = "ruff check src/proclet"

[tool.poe.tasks.fmt]
help = "Format code project."
sequence = [
  { cmd = "ruff check --select I --fix" },
  { cmd = "ruff format" }
]

[tool.poe.tasks."test"]
help = "Run all tests."
cmd = "pytest tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.poe.tasks.release]
help = "Create a new proclet release."
script = "scripts.release:run"

[tool.poe.tasks."release:pre"]
help = "Create a PR with changes for release."
script = "scripts.release:pre"

[tool.poe.tasks."release:post"]
help = "Create a PR preparing the next iteration."
script = "scripts.release:post"

[tool.poe.tasks."docs:api"]
help = "Generate the API reference page of the documentation site."
script = "scripts.api_docs:run"

[tool.poe.tasks."docs:install"]
help = "Install the documentation site dependencies."
cmd = "npm ci --prefix docs"

[tool.poe.tasks."docs:dev"]
help = "Serve the documentation site with live reload."
sequence = ["docs:api", { cmd = "npm run dev --prefix docs" }]

[tool.poe.tasks."docs:build"]
help = "Build the documentation site into docs/.vitepress/dist."
sequence = ["docs:api", { cmd = "npm run build --prefix docs" }]

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"
